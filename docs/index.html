<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CDL-A Hiring Zone Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
<style>
  html, body { height: 100%; margin: 0; font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
  #app { display: flex; height: 100%; }
  #sidebar {
    width: 320px; flex-shrink: 0; background: #fff; border-right: 1px solid #ddd;
    padding: 14px; overflow-y: auto; box-sizing: border-box; z-index: 1001;
  }
  #sidebar h1 { font-size: 17px; margin: 0 0 4px; }
  #sidebar .subtitle { font-size: 12px; color: #666; margin-bottom: 14px; }
  #map { flex: 1; }
  .section { margin-bottom: 16px; }
  .section h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: #888; margin: 0 0 8px; }

  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 16px; }
  .stat-card {
    background: #f7f8fa; border: 1px solid #ecedf0; border-radius: 8px;
    padding: 8px 10px;
  }
  .stat-card .num { font-size: 18px; font-weight: 700; color: #222; line-height: 1.1; }
  .stat-card .lbl { font-size: 10.5px; color: #888; text-transform: uppercase; letter-spacing: .03em; margin-top: 2px; }
  .stat-card.cat-dot .num { display: flex; align-items: center; gap: 5px; }
  .stat-card .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  .toggle-row {
    display: flex; align-items: center; gap: 8px; padding: 5px 6px; font-size: 13px;
    border-radius: 6px; cursor: pointer; user-select: none;
  }
  .toggle-row:hover { background: #f4f5f7; }
  .toggle-row input { display: none; }
  .toggle-row .box {
    width: 15px; height: 15px; border-radius: 4px; border: 1.5px solid #ccc; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; background: #fff;
  }
  .toggle-row input:checked + .box { background: #333; border-color: #333; }
  .toggle-row input:checked + .box::after { content: '✓'; color: #fff; font-size: 10px; line-height: 1; }
  .toggle-row label { cursor: pointer; flex: 1; }
  .toggle-row .rowcount { font-size: 11px; color: #999; flex-shrink: 0; }
  .swatch { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }
  #search, #stateFilter {
    width: 100%; padding: 6px 8px; box-sizing: border-box; border: 1px solid #ccc;
    border-radius: 6px; font-size: 13px; margin-bottom: 4px;
  }
  #count { font-size: 12px; color: #666; margin-top: 4px; margin-bottom: 6px; }
  #resultsList { max-height: 460px; overflow-y: auto; border-top: 1px solid #eee; }

  .result-group-header {
    display: flex; align-items: center; gap: 6px; cursor: pointer;
    position: sticky; top: 0; background: #f7f7f8; z-index: 1;
    padding: 6px 6px; font-size: 12.5px; font-weight: 600; color: #333;
    border-bottom: 1px solid #eee; border-top: 1px solid #f0f0f0;
  }
  .result-group-header:hover { background: #eee; }
  .result-group-header .caret { font-size: 10px; width: 10px; flex-shrink: 0; color: #888; }
  .result-group-header .gcount { font-weight: 400; color: #888; margin-left: auto; }

  .result-card {
    padding: 7px 8px 7px 20px; font-size: 12.5px; cursor: pointer;
    border-bottom: 1px solid #f4f4f4;
  }
  .result-card:hover { background: #f2f2f2; }
  .result-card .rname {
    font-weight: 600; color: #222; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    margin-bottom: 4px;
  }
  .result-card .rmeta { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; }
  .cat-pill {
    display: inline-block; font-size: 10px; font-weight: 700; color: #fff;
    padding: 1px 6px; border-radius: 3px; letter-spacing: .02em; flex-shrink: 0;
  }
  .state-chip {
    display: inline-block; font-size: 10px; color: #444; background: #eef0f3;
    border-radius: 3px; padding: 1px 5px; flex-shrink: 0;
  }
  .state-chip.more { background: #e2e5ea; color: #666; }
  .hot-badge {
    display: inline-block; font-size: 10px; font-weight: 700; color: #92400e;
    background: #fef3c7; border-radius: 3px; padding: 1px 5px; flex-shrink: 0;
  }

  .btn-row { display: flex; gap: 6px; margin-bottom: 8px; }
  .btn-row button {
    flex: 1; font-size: 12px; padding: 5px; border: 1px solid #ccc; background: #f7f7f7;
    border-radius: 6px; cursor: pointer;
  }
  .btn-row button:hover { background: #eee; }
  .leaflet-popup-content { font-size: 13px; max-width: 260px; }
  .leaflet-popup-content b { font-size: 14px; }
  .popup-meta { color: #555; margin: 4px 0; }
  .popup-desc { margin-top: 6px; max-height: 140px; overflow-y: auto; white-space: pre-wrap; font-size: 12px; }
  #sidebar-toggle {
    display: none; position: absolute; top: 10px; left: 10px; z-index: 1002;
    background: #fff; border: 1px solid #ccc; border-radius: 6px; padding: 6px 10px; cursor: pointer;
  }
  .carrier-badge-bar {
    display: flex; gap: 8px; background: rgba(255,255,255,.92); padding: 6px; border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.3);
  }
  .carrier-badge-bar .badge {
    width: 42px; height: 42px; border-radius: 50%; background: #fff; border: 2px solid #eee;
    display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden;
    box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: transform .12s ease, border-color .12s ease;
    flex-shrink: 0;
  }
  .carrier-badge-bar .badge:hover { transform: scale(1.1); border-color: #999; }
  .carrier-badge-bar .badge.active { border-color: #1f2937; border-width: 3px; }
  .carrier-badge-bar .badge img { width: 100%; height: 100%; object-fit: contain; padding: 5px; box-sizing: border-box; }
  @media (max-width: 720px) {
    #sidebar { position: absolute; left: 0; top: 0; bottom: 0; transform: translateX(-100%); transition: transform .2s; }
    #sidebar.open { transform: translateX(0); }
    #sidebar-toggle { display: block; }
  }
</style>
</head>
<body>
<div id="app">
  <button id="sidebar-toggle">Filters</button>
  <div id="sidebar">
    <h1>CDL-A Hiring Zones</h1>
    <div class="subtitle">Click a shape for account details. Use filters to narrow the map.</div>

    <div id="statGrid" class="stat-grid"></div>

    <div class="section">
      <h2>Search</h2>
      <input id="search" type="text" placeholder="Search account, city, or ZIP code...">
      <div id="searchMsg" style="font-size:12px;color:#666;"></div>
    </div>

    <div class="section">
      <h2>Carrier</h2>
      <div class="btn-row">
        <button data-group="carrier" data-action="all">All</button>
        <button data-group="carrier" data-action="none">None</button>
      </div>
      <div id="carrierList"></div>
    </div>

    <div class="section">
      <h2>Category</h2>
      <div class="btn-row">
        <button data-group="category" data-action="all">All</button>
        <button data-group="category" data-action="none">None</button>
      </div>
      <div id="categoryList"></div>
    </div>

    <div class="section">
      <h2>State</h2>
      <select id="stateFilter">
        <option value="">All states</option>
      </select>
    </div>

    <div class="section" id="resultsSection">
      <h2 style="display:flex; align-items:center; justify-content:space-between;">
        <span id="resultsHeadingText">Results</span>
        <button id="clearSelectionBtn" style="display:none; font-size:11px; font-weight:400; text-transform:none; letter-spacing:0; color:#666; background:#f2f2f2; border:1px solid #ddd; border-radius:4px; padding:2px 7px; cursor:pointer;">✕ Clear selection</button>
      </h2>
      <div id="count"></div>
      <div id="resultsList"></div>
    </div>
  </div>
  <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
const CATEGORY_COLORS = { OTR: '#DB4436', Dedicated: '#3F5BA9', Local: '#009D57', Regional: '#F8971B' };

const map = L.map('map', { preferCanvas: true }).setView([39.5, -98.35], 5);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors',
  maxZoom: 18,
}).addTo(map);

const LARGE_RADIUS_MI = 150;
const MAX_STATE_CHIPS = 5;
const CLUSTER_ZOOM_THRESHOLD = 7; // below this zoom: show count clusters; at/above: show actual zone shapes

function clusterIconFor(cluster) {
  const count = cluster.getChildCount();
  let size = 32, font = 12;
  if (count >= 100) { size = 46; font = 15; }
  else if (count >= 20) { size = 38; font = 13; }
  return L.divIcon({
    html: `<div style="width:${size}px;height:${size}px;border-radius:50%;background:#1f2937;color:#fff;
      display:flex;align-items:center;justify-content:center;font-weight:700;font-size:${font}px;
      border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.45);">${count}</div>`,
    className: '',
    iconSize: [size, size],
  });
}

function pointIcon(color) {
  return L.divIcon({
    html: `<div style="width:11px;height:11px;border-radius:50%;background:${color};border:1.5px solid #fff;box-shadow:0 0 0 1px ${color};"></div>`,
    className: '',
    iconSize: [11, 11],
  });
}

// ---- Per-carrier logo badges: a fixed row docked to the map corner (not tied to
// map coordinates), so they act as a persistent carrier switcher instead of
// floating icons scattered/overlapping across the geography. ----
const CARRIER_LOGOS = {
  'Swift': 'logos/swift.png',
  'CR England': 'logos/crengland.png',
  'PAM': 'logos/pam.png',
  'J.B. Hunt': 'logos/jbhunt.png',
  'TransAm': 'logos/transam.png',
  'US Express': 'logos/usx.png',
};
const CarrierBadgeBar = L.Control.extend({
  options: { position: 'bottomleft' },
  onAdd: function () {
    const div = L.DomUtil.create('div', 'carrier-badge-bar');
    L.DomEvent.disableClickPropagation(div);
    L.DomEvent.disableScrollPropagation(div);
    return div;
  },
});
const carrierBadgeBar = new CarrierBadgeBar();
map.addControl(carrierBadgeBar);

const state = { carriers: new Set(), categories: new Set(), stateFilter: '', search: '', zip: null };
let allFeatures = [];
let geoLayer = null;
const clusterLayer = L.markerClusterGroup({
  iconCreateFunction: clusterIconFor,
  showCoverageOnHover: false,
  maxClusterRadius: 70,
});
let zipLookup = {};
let zipMarker = null;
let featureLayerMap = new Map();
let collapsedGroups = new Set();

function updateLayerVisibility() {
  const z = map.getZoom();
  if (z < CLUSTER_ZOOM_THRESHOLD) {
    if (map.hasLayer(geoLayer)) map.removeLayer(geoLayer);
    if (!map.hasLayer(clusterLayer)) map.addLayer(clusterLayer);
  } else {
    if (map.hasLayer(clusterLayer)) map.removeLayer(clusterLayer);
    if (geoLayer && !map.hasLayer(geoLayer)) map.addLayer(geoLayer);
  }
}
map.on('zoomend', updateLayerVisibility);

function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ---- Point-in-polygon / distance helpers (GeoJSON coords are [lon, lat]) ----
function pointInRing(pt, ring) {
  const [x, y] = pt;
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const [xi, yi] = ring[i], [xj, yj] = ring[j];
    const intersect = ((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
    if (intersect) inside = !inside;
  }
  return inside;
}
function pointInPolygon(pt, coords) {
  if (!pointInRing(pt, coords[0])) return false;
  for (let i = 1; i < coords.length; i++) if (pointInRing(pt, coords[i])) return false;
  return true;
}
function pointInGeometry(pt, geometry) {
  if (!geometry) return false;
  if (geometry.type === 'Polygon') return pointInPolygon(pt, geometry.coordinates);
  if (geometry.type === 'MultiPolygon') return geometry.coordinates.some(poly => pointInPolygon(pt, poly));
  if (geometry.type === 'Point') return haversineMiles(pt, geometry.coordinates) <= 10;
  return false;
}
function haversineMiles(a, b) {
  // a, b are [lon, lat]
  const R = 3958.8;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(b[1] - a[1]);
  const dLon = toRad(b[0] - a[0]);
  const lat1 = toRad(a[1]), lat2 = toRad(b[1]);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.asin(Math.sqrt(h));
}

function popupHtml(props) {
  const states = (props.hiring_states || []).join(', ');
  const desc = escapeHtml(props.description).slice(0, 1200);
  return `
    <b>${escapeHtml(props.account)}</b>
    <div class="popup-meta">${escapeHtml(props.carrier)} &middot; ${escapeHtml(props.category)}${states ? ' &middot; ' + escapeHtml(states) : ''}</div>
    ${desc ? `<div class="popup-desc">${desc}</div>` : ''}
  `;
}

function passesFilters(feature) {
  const props = feature.properties;
  if (state.carriers.size && !state.carriers.has(props.carrier)) return false;
  if (state.categories.size && !state.categories.has(props.category)) return false;
  if (state.stateFilter && !(props.hiring_states || []).includes(state.stateFilter)) return false;
  if (state.zip) {
    if (!pointInGeometry(state.zip.coord, feature.geometry)) return false;
  } else if (state.search) {
    const hay = (props.account + ' ' + props.description).toLowerCase();
    if (!hay.includes(state.search)) return false;
  }
  return true;
}

function styleFor(props) {
  const color = CATEGORY_COLORS[props.category] || '#777777';
  if (props.size_mi > LARGE_RADIUS_MI) {
    return { color, weight: 1.5, fill: true, fillOpacity: 0, dashArray: '5,5', opacity: 1 };
  }
  return { color, weight: 1.5, fillColor: color, fillOpacity: 0.28, opacity: 1 };
}

// When an account is selected (via map click or results-list click), every other
// visible shape is dimmed so the selected zone stands out instead of getting lost
// in the pile of overlapping boundaries at high zoom.
function dimmedStyleFor(props) {
  const base = styleFor(props);
  return { ...base, weight: 0.75, opacity: 0.1, fillOpacity: (base.fillOpacity || 0) * 0.15, dashArray: base.dashArray };
}
function selectedStyleFor(props) {
  const base = styleFor(props);
  return { ...base, weight: 3.5, opacity: 1, fillOpacity: Math.min((base.fillOpacity || 0) + 0.25, 0.75) };
}

let selectedFeature = null;

function applySelectionDimming() {
  const hasSelection = !!selectedFeature;
  const btn = document.getElementById('clearSelectionBtn');
  if (btn) btn.style.display = hasSelection ? 'inline-block' : 'none';
  featureLayerMap.forEach((layer, f) => {
    if (!layer.setStyle) return;
    if (!hasSelection) layer.setStyle(styleFor(f.properties));
    else if (f === selectedFeature) {
      layer.setStyle(selectedStyleFor(f.properties));
      if (layer.bringToFront) layer.bringToFront();
    } else {
      layer.setStyle(dimmedStyleFor(f.properties));
    }
  });
}

function selectFeature(f) {
  selectedFeature = f;
  applySelectionDimming();
}

function clearSelection() {
  selectedFeature = null;
  applySelectionDimming();
}

function zoomToFeature(f) {
  const layer = featureLayerMap.get(f);
  if (!layer) return;
  if (map.hasLayer(clusterLayer)) map.removeLayer(clusterLayer);
  if (!map.hasLayer(geoLayer)) map.addLayer(geoLayer);
  if (layer.getBounds) map.fitBounds(layer.getBounds(), { maxZoom: 9 });
  else if (layer.getLatLng) map.setView(layer.getLatLng(), 9);
  layer.openPopup();
  selectFeature(f);
}

let allCarrierNames = [];

function buildCarrierBadges(features) {
  const container = carrierBadgeBar.getContainer();
  if (!container) return;
  container.innerHTML = '';
  const carrierCounts = new Map();
  features.forEach(f => {
    if (!f.properties.center) return;
    const carrier = f.properties.carrier;
    carrierCounts.set(carrier, (carrierCounts.get(carrier) || 0) + 1);
  });
  [...carrierCounts.keys()].sort().forEach(carrier => {
    const el = document.createElement('div');
    el.className = 'badge';
    el.dataset.carrier = carrier;
    el.title = `${carrier} · ${carrierCounts.get(carrier)} accounts · click to view hiring area`;
    el.innerHTML = `<img src="${CARRIER_LOGOS[carrier] || ''}" alt="${escapeHtml(carrier)}">`;
    el.addEventListener('click', () => selectCarrierOnly(carrier));
    container.appendChild(el);
  });
  updateBadgeActiveStates();
}

function updateBadgeActiveStates() {
  const container = carrierBadgeBar.getContainer();
  if (!container) return;
  const filtered = state.carriers.size > 0 && state.carriers.size < allCarrierNames.length;
  [...container.children].forEach(el => {
    el.classList.toggle('active', filtered && state.carriers.has(el.dataset.carrier));
  });
}

function selectCarrierOnly(carrier) {
  const alreadyOnly = state.carriers.size === 1 && state.carriers.has(carrier);
  document.querySelectorAll('#carrierList input[type=checkbox]').forEach(cb => {
    const name = cb.id.slice('chk-carrierList-'.length);
    cb.checked = alreadyOnly ? true : name === carrier;
  });
  state.carriers.clear();
  if (alreadyOnly) {
    allCarrierNames.forEach(v => state.carriers.add(v));
  } else {
    state.carriers.add(carrier);
  }
  render();
  updateBadgeActiveStates();

  const carrierFeatures = allFeatures.filter(f => f.properties.carrier === carrier && f.properties.center);
  if (carrierFeatures.length) {
    const bounds = L.latLngBounds(carrierFeatures.map(f => [f.properties.center[0], f.properties.center[1]]));
    map.fitBounds(bounds, { maxZoom: 7, padding: [40, 40] });
  }
}

function stateChipsHtml(states) {
  if (!states || !states.length) return '';
  const shown = states.slice(0, MAX_STATE_CHIPS);
  const extra = states.length - shown.length;
  let html = shown.map(s => `<span class="state-chip">${escapeHtml(s)}</span>`).join('');
  if (extra > 0) html += `<span class="state-chip more">+${extra}</span>`;
  return html;
}

function buildResultsList(features) {
  const container = document.getElementById('resultsList');
  container.innerHTML = '';

  const groups = new Map();
  features.forEach(f => {
    const carrier = f.properties.carrier;
    if (!groups.has(carrier)) groups.set(carrier, []);
    groups.get(carrier).push(f);
  });

  const carrierNames = state.zip
    ? [...groups.keys()].sort((a, b) => groups.get(b).length - groups.get(a).length)
    : [...groups.keys()].sort();
  carrierNames.forEach(carrier => {
    const items = groups.get(carrier).sort((a, b) => a.properties.account.localeCompare(b.properties.account));
    const collapsed = collapsedGroups.has(carrier);

    const header = document.createElement('div');
    header.className = 'result-group-header';
    header.innerHTML = `<span class="caret">${collapsed ? '▸' : '▾'}</span><span>${escapeHtml(carrier)}</span><span class="gcount">${items.length}</span>`;
    header.addEventListener('click', () => {
      if (collapsedGroups.has(carrier)) collapsedGroups.delete(carrier);
      else collapsedGroups.add(carrier);
      buildResultsList(features);
    });
    container.appendChild(header);

    if (collapsed) return;

    items.forEach(f => {
      const props = f.properties;
      const color = CATEGORY_COLORS[props.category] || '#777777';
      const card = document.createElement('div');
      card.className = 'result-card';
      const hotBadge = props.hot ? `<span class="hot-badge">🔥 $${(props.sign_on_bonus || 0).toLocaleString('en-US')} bonus</span>` : '';
      card.innerHTML = `
        <div class="rname" title="${escapeHtml(props.account)}">${escapeHtml(props.account)}</div>
        <div class="rmeta">
          <span class="cat-pill" style="background:${color}">${escapeHtml(props.category)}</span>
          ${hotBadge}
          ${stateChipsHtml(props.hiring_states)}
        </div>
      `;
      card.addEventListener('click', () => zoomToFeature(f));
      container.appendChild(card);
    });
  });
}

function render() {
  if (geoLayer) map.removeLayer(geoLayer);
  featureLayerMap = new Map();
  let shown = 0;
  let resultsFeatures = [];
  geoLayer = L.geoJSON(allFeatures, {
    filter: f => passesFilters(f),
    style: f => styleFor(f.properties),
    pointToLayer: (f, latlng) => L.circleMarker(latlng, { radius: 5, ...styleFor(f.properties) }),
    onEachFeature: (f, layer) => {
      shown++;
      resultsFeatures.push(f);
      featureLayerMap.set(f, layer);
      layer.bindPopup(popupHtml(f.properties));
      layer.on('click', () => selectFeature(f));
    },
  });

  const resultsHeading = document.getElementById('resultsHeadingText');
  const msgEl = document.getElementById('searchMsg');
  if (state.zip) {
    resultsHeading.textContent = 'Recommended Companies & Accounts';
    collapsedGroups.clear();
    if (shown > 0) {
      const carrierCount = new Set(resultsFeatures.map(f => f.properties.carrier)).size;
      msgEl.textContent = `${carrierCount} carrier${carrierCount === 1 ? '' : 's'}, ${shown} account${shown === 1 ? '' : 's'} can hire near ZIP ${state.zip.code}`;
      document.getElementById('count').textContent = `${shown} account${shown === 1 ? '' : 's'} shown`;
    } else {
      // No exact shape covers this ZIP — fall back to nearest accounts by center distance
      const withCenter = allFeatures.filter(f => f.properties.center && passesFiltersIgnoringZip(f));
      const nearest = withCenter
        .map(f => ({ f, dist: haversineMiles(state.zip.coord, [f.properties.center[1], f.properties.center[0]]) }))
        .sort((a, b) => a.dist - b.dist)
        .slice(0, 8);
      nearest.forEach(({ f }) => {
        const layer = L.geoJSON(f, { style: () => styleFor(f.properties), pointToLayer: (ff, latlng) => L.circleMarker(latlng, { radius: 5, ...styleFor(f.properties) }) });
        layer.eachLayer(l => { l.bindPopup(popupHtml(f.properties)); l.on('click', () => selectFeature(f)); geoLayer.addLayer(l); featureLayerMap.set(f, l); });
        resultsFeatures.push(f);
        shown++;
      });
      const nearestDist = nearest.length ? nearest[0].dist.toFixed(0) : null;
      msgEl.textContent = nearest.length
        ? `No shape covers ZIP ${state.zip.code} — showing ${nearest.length} nearest accounts (closest ~${nearestDist} mi away)`
        : `No accounts found near ZIP ${state.zip.code}`;
      document.getElementById('count').textContent = `${shown} account${shown === 1 ? '' : 's'} shown (nearest match)`;
    }
  } else {
    resultsHeading.textContent = 'Results';
    msgEl.textContent = '';
    document.getElementById('count').textContent = `${shown} account${shown === 1 ? '' : 's'} shown`;
  }

  buildResultsList(resultsFeatures);

  clusterLayer.clearLayers();
  resultsFeatures.forEach(f => {
    const c = f.properties.center;
    if (!c) return;
    const color = CATEGORY_COLORS[f.properties.category] || '#777777';
    const marker = L.marker([c[0], c[1]], { icon: pointIcon(color) });
    marker.bindPopup(popupHtml(f.properties));
    clusterLayer.addLayer(marker);
  });
  updateLayerVisibility();

  if (selectedFeature && !featureLayerMap.has(selectedFeature)) selectedFeature = null;
  applySelectionDimming();
}

function passesFiltersIgnoringZip(feature) {
  const props = feature.properties;
  if (state.carriers.size && !state.carriers.has(props.carrier)) return false;
  if (state.categories.size && !state.categories.has(props.category)) return false;
  if (state.stateFilter && !(props.hiring_states || []).includes(state.stateFilter)) return false;
  return true;
}

function buildCheckboxList(containerId, values, targetSet, counts) {
  const container = document.getElementById(containerId);
  container.innerHTML = '';
  values.forEach(v => {
    const row = document.createElement('div');
    row.className = 'toggle-row';
    const swatchColor = CATEGORY_COLORS[v] || '#999';
    row.innerHTML = `
      <input type="checkbox" id="chk-${containerId}-${v}" checked><span class="box"></span>
      ${containerId === 'categoryList' ? `<span class="swatch" style="background:${swatchColor}"></span>` : ''}
      <label for="chk-${containerId}-${v}">${escapeHtml(v)}</label>
      <span class="rowcount">${counts[v] || 0}</span>
    `;
    container.appendChild(row);
    targetSet.add(v);
    row.querySelector('input').addEventListener('change', e => {
      if (e.target.checked) targetSet.add(v); else targetSet.delete(v);
      render();
      if (containerId === 'carrierList') updateBadgeActiveStates();
    });
  });
}

function buildStatGrid(features) {
  const grid = document.getElementById('statGrid');
  const categories = ['OTR', 'Dedicated', 'Regional', 'Local'];
  const carrierCount = new Set(features.map(f => f.properties.carrier)).size;
  const catCounts = {};
  categories.forEach(c => catCounts[c] = 0);
  features.forEach(f => { catCounts[f.properties.category] = (catCounts[f.properties.category] || 0) + 1; });

  const cards = [
    { num: features.length, lbl: 'Accounts' },
    { num: carrierCount, lbl: 'Carriers' },
    ...categories.map(c => ({ num: catCounts[c] || 0, lbl: c, color: CATEGORY_COLORS[c] })),
  ];
  grid.innerHTML = cards.map(c => `
    <div class="stat-card${c.color ? ' cat-dot' : ''}">
      <div class="num">${c.color ? `<span class="dot" style="background:${c.color}"></span>` : ''}${c.num}</div>
      <div class="lbl">${escapeHtml(c.lbl)}</div>
    </div>
  `).join('');
}

Promise.all([
  fetch('data.geojson').then(r => r.json()),
  fetch('zips.json').then(r => r.json()),
])
  .then(([fc, zips]) => {
    allFeatures = fc.features;
    zipLookup = zips;
    const carriers = [...new Set(allFeatures.map(f => f.properties.carrier))].sort();
    const categories = [...new Set(allFeatures.map(f => f.properties.category))].sort();
    const states = [...new Set(allFeatures.flatMap(f => f.properties.hiring_states || []))].sort();
    allCarrierNames = carriers;
    buildCarrierBadges(allFeatures);

    const carrierCounts = {}, categoryCounts = {};
    allFeatures.forEach(f => {
      carrierCounts[f.properties.carrier] = (carrierCounts[f.properties.carrier] || 0) + 1;
      categoryCounts[f.properties.category] = (categoryCounts[f.properties.category] || 0) + 1;
    });

    buildStatGrid(allFeatures);
    buildCheckboxList('carrierList', carriers, state.carriers, carrierCounts);
    buildCheckboxList('categoryList', categories, state.categories, categoryCounts);

    const stateSelect = document.getElementById('stateFilter');
    states.forEach(s => {
      const opt = document.createElement('option');
      opt.value = s; opt.textContent = s;
      stateSelect.appendChild(opt);
    });
    stateSelect.addEventListener('change', e => { state.stateFilter = e.target.value; render(); });

    document.getElementById('search').addEventListener('input', e => {
      const raw = e.target.value.trim();
      const msgEl = document.getElementById('searchMsg');

      if (/^\d{5}$/.test(raw)) {
        const coordLatLon = zipLookup[raw];
        if (coordLatLon) {
          state.zip = { code: raw, coord: [coordLatLon[1], coordLatLon[0]] };
          state.search = '';
          if (zipMarker) map.removeLayer(zipMarker);
          zipMarker = L.marker([coordLatLon[0], coordLatLon[1]], {
            icon: L.divIcon({ className: '', html: '<div style="width:14px;height:14px;border-radius:50%;background:#111;border:2px solid #fff;box-shadow:0 0 0 2px #111;"></div>', iconSize: [14, 14] }),
          }).addTo(map);
          map.setView([coordLatLon[0], coordLatLon[1]], 8);
        } else {
          state.zip = null;
          state.search = '';
          if (zipMarker) { map.removeLayer(zipMarker); zipMarker = null; }
          render();
          msgEl.textContent = `ZIP ${raw} not found`;
          return;
        }
      } else {
        state.zip = null;
        state.search = raw.toLowerCase();
        if (zipMarker) { map.removeLayer(zipMarker); zipMarker = null; }
      }
      render();
    });

    document.querySelectorAll('.btn-row button').forEach(btn => {
      btn.addEventListener('click', () => {
        const group = btn.dataset.group;
        const listId = group === 'carrier' ? 'carrierList' : 'categoryList';
        const targetSet = group === 'carrier' ? state.carriers : state.categories;
        document.querySelectorAll(`#${listId} input[type=checkbox]`).forEach(cb => {
          cb.checked = btn.dataset.action === 'all';
        });
        targetSet.clear();
        if (btn.dataset.action === 'all') {
          (group === 'carrier' ? carriers : categories).forEach(v => targetSet.add(v));
        }
        render();
        if (group === 'carrier') updateBadgeActiveStates();
      });
    });

    render();
  });

document.getElementById('sidebar-toggle').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('open');
});

document.getElementById('clearSelectionBtn').addEventListener('click', clearSelection);
</script>
</body>
</html>
